<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Gotham Lineup Triage</title>
<desc id="desc">A stylized fantasy football lineup triage board with three checkpoints: Thursday morning, Sunday morning, and player kickoff.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#081626"/><stop offset="1" stop-color="#32141a"/></linearGradient>
  <linearGradient id="field" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f3d30"/><stop offset=".5" stop-color="#185842"/><stop offset="1" stop-color="#0f3d30"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="14" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
  <pattern id="grain" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r="1" fill="#fff" opacity=".04"/><circle cx="17" cy="14" r="1" fill="#000" opacity=".08"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g fill="#0c1019">
  <rect x="0" y="430" width="90" height="350"/><rect x="75" y="330" width="75" height="450"/><rect x="140" y="395" width="100" height="385"/><rect x="225" y="300" width="75" height="480"/><rect x="290" y="385" width="95" height="395"/>
  <rect x="1180" y="350" width="95" height="430"/><rect x="1260" y="275" width="80" height="505"/><rect x="1325" y="400" width="85" height="380"/><rect x="1395" y="315" width="95" height="465"/><rect x="1480" y="380" width="120" height="400"/>
</g>
<g fill="#e5ad4c" opacity=".55">
  <rect x="95" y="375" width="8" height="14"/><rect x="116" y="408" width="8" height="14"/><rect x="247" y="352" width="8" height="14"/><rect x="271" y="425" width="8" height="14"/>
  <rect x="1290" y="324" width="8" height="14"/><rect x="1314" y="390" width="8" height="14"/><rect x="1430" y="365" width="8" height="14"/><rect x="1460" y="425" width="8" height="14"/>
</g>
<rect y="780" width="1600" height="120" fill="url(#field)"/>
<g stroke="#2b765b" stroke-width="2" opacity=".7"><line x1="0" y1="806" x2="1600" y2="806"/><line x1="0" y1="836" x2="1600" y2="836"/><line x1="0" y1="866" x2="1600" y2="866"/></g>
<text x="800" y="92" text-anchor="middle" fill="#f8f1df" font-family="Georgia,serif" font-size="78" font-weight="700">GOTHAM LINEUP TRIAGE</text>
<text x="800" y="146" text-anchor="middle" fill="#f1c46e" font-family="Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="3">BYE WEEKS. INJURIES. ONE LOCK AT A TIME.</text>

<g filter="url(#shadow)">
  <rect x="475" y="210" width="650" height="570" rx="34" fill="#efe6d0" stroke="#382a25" stroke-width="6"/>
  <rect x="680" y="178" width="240" height="78" rx="20" fill="#6f6052" stroke="#1b1714" stroke-width="5"/>
  <rect x="720" y="198" width="160" height="38" rx="14" fill="#c5b397"/>
</g>
<text x="800" y="305" text-anchor="middle" fill="#1c222a" font-family="Arial,sans-serif" font-size="40" font-weight="800">LINEUP CHECKPOINTS</text>

<g font-family="Arial,sans-serif">
  <rect x="525" y="342" width="550" height="120" rx="22" fill="#fffaf0" stroke="#2a609a" stroke-width="5"/>
  <rect x="545" y="364" width="150" height="78" rx="16" fill="#2a609a"/><text x="620" y="413" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">THU AM</text>
  <text x="725" y="395" fill="#1a2028" font-size="31" font-weight="800">CHECK BYES</text><text x="725" y="434" fill="#555" font-size="19">Move later players to FLEX</text>
  <circle cx="1048" cy="402" r="16" fill="#238e52"/><path d="M1039 402l7 8 13-17" fill="none" stroke="#fff" stroke-width="4"/>

  <rect x="525" y="482" width="550" height="120" rx="22" fill="#fffaf0" stroke="#ac422f" stroke-width="5"/>
  <rect x="545" y="504" width="150" height="78" rx="16" fill="#ac422f"/><text x="620" y="553" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">SUN AM</text>
  <text x="725" y="535" fill="#1a2028" font-size="31" font-weight="800">CHECK STATUS</text><text x="725" y="574" fill="#555" font-size="19">Inactives change before games</text>
  <circle cx="1048" cy="542" r="16" fill="#238e52"/><path d="M1039 542l7 8 13-17" fill="none" stroke="#fff" stroke-width="4"/>

  <rect x="525" y="622" width="550" height="120" rx="22" fill="#fffaf0" stroke="#237c52" stroke-width="5"/>
  <rect x="545" y="644" width="150" height="78" rx="16" fill="#237c52"/><text x="620" y="693" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">KICKOFF</text>
  <text x="725" y="675" fill="#1a2028" font-size="31" font-weight="800">LOCKED</text><text x="725" y="714" fill="#555" font-size="19">Swap before that player's game</text>
  <circle cx="1048" cy="682" r="16" fill="#238e52"/><path d="M1039 682l7 8 13-17" fill="none" stroke="#fff" stroke-width="4"/>
</g>

<g filter="url(#shadow)">
  <circle cx="310" cy="355" r="72" fill="#d39a70" stroke="#261a18" stroke-width="5"/>
  <path d="M240 350q70-110 145-10v-45q-75-45-145 10z" fill="#2c1d19"/>
  <rect x="205" y="425" width="215" height="345" rx="62" fill="#202f4e" stroke="#080b11" stroke-width="6"/>
  <path d="M260 510L165 610" stroke="#d39a70" stroke-width="38" stroke-linecap="round"/>
  <rect x="112" y="563" width="96" height="118" rx="16" fill="#1d2430" stroke="#bbb" stroke-width="3"/>
  <path d="M370 510L455 613" stroke="#d39a70" stroke-width="38" stroke-linecap="round"/>
</g>
<text x="312" y="528" text-anchor="middle" fill="#f1c46e" font-family="Arial,sans-serif" font-size="25" font-weight="800">MANAGER</text>
<g filter="url(#shadow)"><rect x="86" y="235" width="236" height="112" rx="24" fill="#faf5e7" stroke="#222" stroke-width="4"/><path d="M220 340l55 60-17-66" fill="#faf5e7" stroke="#222" stroke-width="4"/></g>
<text x="204" y="278" text-anchor="middle" fill="#222" font-family="Arial,sans-serif" font-size="23" font-weight="800"><tspan x="204" dy="0">WHO IS</tspan><tspan x="204" dy="31">ACTUALLY PLAYING?</tspan></text>

<g filter="url(#shadow)"><rect x="1190" y="320" width="310" height="435" rx="25" fill="#161c28" stroke="#e4c077" stroke-width="5"/></g>
<text x="1345" y="372" text-anchor="middle" fill="#f1c46e" font-family="Arial,sans-serif" font-size="30" font-weight="800">ROSTER TRIAGE</text>
<g font-family="Arial,sans-serif" font-weight="800" fill="#fff">
  <rect x="1228" y="410" width="234" height="72" rx="15" fill="#973f3b"/><text x="1255" y="455" font-size="23">IR</text><text x="1440" y="455" text-anchor="end" font-size="18">SAVE THE STAR</text>
  <rect x="1228" y="510" width="234" height="72" rx="15" fill="#265b9b"/><text x="1255" y="555" font-size="23">BENCH</text><text x="1440" y="555" text-anchor="end" font-size="18">HOLD THE BYE</text>
  <rect x="1228" y="610" width="234" height="72" rx="15" fill="#626870"/><text x="1255" y="655" font-size="23">DROP</text><text x="1440" y="655" text-anchor="end" font-size="18">LOWEST UPSIDE</text>
</g>
<rect x="385" y="812" width="830" height="62" rx="24" fill="#971f27" stroke="#f1c46e" stroke-width="3"/>
<text x="800" y="852" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="800">CHECK THURSDAY. CHECK SUNDAY. SWAP BEFORE KICKOFF.</text>
<rect width="1600" height="900" fill="url(#grain)"/>
</svg>