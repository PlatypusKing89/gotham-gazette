<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Next Man Up. Again.</title>
<desc id="desc">Editorial cartoon about the Los Angeles Rams replacing kicker Harrison Mevis with Blake Grupe, only for Grupe to suffer a season-ending knee injury making a tackle.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151f34"/><stop offset="1" stop-color="#0b101b"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="12" dy="16" stdDeviation="13" flood-color="#000" flood-opacity=".55"/></filter>
  <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="4" cy="8" r="1" fill="#fff" opacity=".045"/><circle cx="18" cy="16" r="1" fill="#000" opacity=".09"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<path d="M0 0h470l155 900H0z" fill="#1c3b68"/><path d="M1130 0h470v900H975z" fill="#c8992e"/>
<rect x="485" y="108" width="630" height="742" fill="#ebe1ca" stroke="#302824" stroke-width="8"/>
<text x="800" y="82" text-anchor="middle" fill="#f7f0df" font-family="Georgia,serif" font-size="67" font-weight="700">NEXT MAN UP. AGAIN.</text>
<rect x="610" y="150" width="380" height="100" rx="16" fill="#7d1720"/>
<text x="800" y="214" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="800">KICKER WANTED</text>

<g filter="url(#shadow)">
  <path d="M105 500h225v115h90v112H175v-65H90z" fill="#2d2d33" stroke="#000" stroke-width="6"/>
  <rect x="92" y="727" width="343" height="66" fill="#19191d" stroke="#000" stroke-width="5"/>
</g>
<text x="255" y="580" text-anchor="middle" fill="#ecd078" font-family="Arial,sans-serif" font-size="35" font-weight="800">MEVIS</text>
<text x="260" y="835" text-anchor="middle" fill="#fff0d0" font-family="Arial,sans-serif" font-size="31" font-weight="800">OUT</text>
<rect x="82" y="170" width="360" height="80" rx="18" fill="#151b27" stroke="#ecd078" stroke-width="3"/>
<text x="262" y="220" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="800">THE BIG GUY</text>

<g filter="url(#shadow)">
  <circle cx="1092" cy="345" r="44" fill="#d29a6d" stroke="#241a18" stroke-width="4"/>
  <rect x="1067" y="382" width="54" height="168" fill="#294e89" stroke="#101b33" stroke-width="4"/>
  <text x="1094" y="465" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="800">19</text>
  <line x1="1078" y1="543" x2="1044" y2="690" stroke="#d29a6d" stroke-width="25" stroke-linecap="round"/>
  <line x1="1110" y1="543" x2="1150" y2="690" stroke="#e8e8e0" stroke-width="35" stroke-linecap="round"/>
  <rect x="1125" y="650" width="60" height="72" fill="#f4f4ed" stroke="#333" stroke-width="3"/>
  <line x1="1028" y1="405" x2="990" y2="735" stroke="#aaa" stroke-width="8"/><line x1="1160" y1="405" x2="1210" y2="735" stroke="#aaa" stroke-width="8"/>
  <line x1="1005" y1="470" x2="1045" y2="470" stroke="#aaa" stroke-width="8"/><line x1="1142" y1="470" x2="1180" y2="470" stroke="#aaa" stroke-width="8"/>
</g>
<text x="1095" y="760" text-anchor="middle" fill="#222" font-family="Arial,sans-serif" font-size="28" font-weight="800">GRUPE</text>

<g filter="url(#shadow)">
  <circle cx="1330" cy="355" r="48" fill="#d8a479" stroke="#2b211d" stroke-width="4"/>
  <rect x="1260" y="405" width="145" height="245" rx="36" fill="#203e69" stroke="#101b32" stroke-width="5"/>
  <text x="1333" y="515" text-anchor="middle" fill="#f0be3a" font-family="Arial,sans-serif" font-size="72" font-weight="800">P</text>
  <line x1="1288" y1="640" x2="1260" y2="770" stroke="#d8a479" stroke-width="28" stroke-linecap="round"/>
  <line x1="1378" y1="640" x2="1410" y2="770" stroke="#d8a479" stroke-width="28" stroke-linecap="round"/>
</g>
<path d="M1420 600h40l-20 35z" fill="#eead34" stroke="#2b211d" stroke-width="3"/><line x1="1440" y1="635" x2="1440" y2="750" stroke="#eead34" stroke-width="10"/><ellipse cx="1440" cy="755" rx="36" ry="15" fill="#eead34"/>

<g filter="url(#shadow)"><rect x="1165" y="165" width="345" height="115" rx="28" fill="#faf5e6" stroke="#222" stroke-width="4"/><path d="M1280 270l45 60 35-60" fill="#faf5e6" stroke="#222" stroke-width="4"/></g>
<text x="1338" y="230" text-anchor="middle" fill="#222" font-family="Arial,sans-serif" font-size="31" font-weight="800">DO I KICK NOW?</text>

<rect x="635" y="600" width="330" height="180" fill="#704d2c" stroke="#2b1b12" stroke-width="6"/>
<text x="800" y="660" text-anchor="middle" fill="#f5e3bb" font-family="Arial,sans-serif" font-size="29" font-weight="800"><tspan x="800" dy="0">RAMS</tspan><tspan x="800" dy="38">SPECIAL TEAMS</tspan></text>
<rect x="960" y="785" width="560" height="67" rx="18" fill="#7d1720"/>
<text x="1240" y="827" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="800">ONE FIELD GOAL. ONE TACKLE. ONE TORN ACL.</text>
<g fill="#754626" stroke="#f6ecd5" stroke-width="3"><ellipse cx="530" cy="740" rx="35" ry="20"/><ellipse cx="540" cy="280" rx="35" ry="20"/><ellipse cx="1460" cy="365" rx="35" ry="20"/></g>
<rect width="1600" height="900" fill="url(#grain)"/>
</svg>