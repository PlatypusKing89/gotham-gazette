<circle cx="179" cy="-20" r="12" fill="#a82c45"/>
<rect x="91" y="444" width="198" height="52" rx="7" fill="#f6dfb9" stroke="#131821" stroke-width="6"/>
<text x="190" y="481" text-anchor="middle" font-size="37" font-family="Arial,sans-serif" font-weight="900" fill="#8b2639">GEORGE 6-2</text>
</g>
<!-- LEFT/RIGHT SCORE FLAGS -->
<g transform="translate(840 336)">
<rect width="260" height="65" fill="#f1d9ae" stroke="#1c1c27" stroke-width="7"/>
<text x="130" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="27" fill="#9b283d">QB: NO GAME</text>
<rect y="82" width="260" height="65" fill="#f1d9ae" stroke="#1c1c27" stroke-width="7"/>
<text x="130" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="27" fill="#9b283d">RB2: EMPTY</text>
<rect y="164" width="260" height="65" fill="#e4bd74" stroke="#1c1c27" stroke-width="7"/>
<text x="130" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="29" fill="#152133">STILL WON.</text>
</g>
<!-- BOTTOM CAMPAIGN BANNER -->
<path d="M50 739H1550V841H50Z" fill="#f3d6a0" stroke="#15202e" stroke-width="9"/>
<rect x="64" y="752" width="1472" height="74" fill="#132c42"/>
<text x="800" y="801" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="53" font-weight="900" letter-spacing="2" fill="#f6d79a">THE GAZETTE ENDORSES HENNY FOR WEEK 9</text>
<text x="800" y="863" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="19" letter-spacing="4" fill="#f6d79a">ONE LEAGUE. TWELVE MANAGERS. ZERO MORE FREE PASSES.</text>
