<rect x="30" y="30" width="1540" height="840" fill="url(#dots)"/>
<path d="M0 674L79 674 79 540 117 540 117 597 159 597 159 449 208 449 208 537 265 537 265 410 327 410 327 506 363 506 363 586 412 586 412 390 458 390 458 563 505 563 505 468 577 468 577 590 627 590 627 432 683 432 683 551 727 551 727 448 791 448 791 589 846 589 846 388 915 388 915 555 976 555 976 458 1025 458 1025 596 1073 596 1073 407 1152 407 1152 551 1193 551 1193 492 1248 492 1248 553 1295 553 1295 397 1354 397 1354 507 1425 507 1425 427 1470 427 1470 579 1539 579 1539 663 1600 663V900H0Z" fill="#0a1320" opacity=".93"/>
<g fill="#ddbe82" opacity=".55"><rect x="184" y="472" width="12" height="18"/><rect x="288" y="435" width="12" height="19"/><rect x="650" y="471" width="10" height="14"/><rect x="879" y="428" width="14" height="20"/><rect x="1110" y="445" width="13" height="19"/><rect x="1329" y="448" width="13" height="21"/><rect x="1438" y="466" width="9" height="13"/></g>
<g opacity=".48" stroke="#b5a2ac" stroke-width="3"><path d="M0 709L1600 709"/><path d="M0 740L1600 740"/></g>
<rect x="45" y="44" width="1510" height="73" fill="#f3dfba" stroke="#191522" stroke-width="4"/>
<text x="82" y="89" font-family="Georgia,serif" font-weight="900" font-size="40" fill="#1e1d25" letter-spacing="1.3">THE GOTHAM GAZETTE</text>
<text x="1530" y="83" text-anchor="end" font-family="Arial,sans-serif" font-weight="900" font-size="22" fill="#8f2437" letter-spacing="2">NOVEMBER 3, 2026 | ISSUE 8</text>
<text x="1530" y="108" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#253249" letter-spacing="1.5">ELECTION DAY FANTASY SPECIAL</text>
<rect x="62" y="139" width="1476" height="156" fill="#b52b3d" stroke="#f3d8a3" stroke-width="4" filter="url(#shadow)"/>
<text x="800" y="220" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="116" font-weight="900" letter-spacing="6" fill="#fbe9cc">STOP GEORGE.</text>
<text x="800" y="271" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="37" letter-spacing="9" fill="#ffe3a5">THE EDITOR HAS HAD ENOUGH.</text>
