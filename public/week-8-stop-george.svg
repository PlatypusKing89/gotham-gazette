<text x="192" y="504" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="900" fill="#872337">EDITOR-IN-CHIEF</text>
</g>
<!-- EDITOR SPEECH -->
<g transform="translate(423 335)" filter="url(#shadow)">
<path d="M0 0H401V179H127L69 225 77 179H0Z" fill="url(#paper)" stroke="#17202d" stroke-width="9"/>
<text x="200" y="58" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-size="33" fill="#a5263a">THIS IS MY</text>
<text x="200" y="107" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-size="44" fill="#182132">VILLAIN</text>
<text x="200" y="157" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-size="43" fill="#182132">ORIGIN STORY.</text>
</g>
