<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">The Gotham Gazette Election Day special: The Editor vs. George</title>
<desc id="desc">Vintage comic illustration of an angry robot newspaper editor promoting Henny while a crowned George, with an inactive quarterback and empty running back slot, dominates a Gotham City skyline.</desc>
<defs>
<linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b2b"/><stop offset=".54" stop-color="#283047"/><stop offset="1" stop-color="#4a2637"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7e8c7"/><stop offset="1" stop-color="#d5b98b"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f8d37e"/><stop offset="1" stop-color="#a87530"/></linearGradient>
<pattern id="dots" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.8" fill="#efd5a8" opacity=".22"/></pattern>
<pattern id="cross" width="19" height="19" patternUnits="userSpaceOnUse"><path d="M0 0L19 19M19 0L0 19" stroke="#000" stroke-opacity=".08" stroke-width="1"/></pattern>
<filter id="shadow"><feDropShadow dx="6" dy="8" stdDeviation="4" flood-color="#000" flood-opacity=".5"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="3" seed="5"/><feColorMatrix values="0 0 0 0 0.45 0 0 0 0 0.31 0 0 0 0 0.19 0 0 0 .12 0"/></filter>
</defs>
<rect width="1600" height="900" fill="#161d2b"/>
