name: Import approved Week 7 artwork
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-week7-art.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download approved illustration
        env:
          ART_URL: 'https://docs.google.com/docs-images-rt/ALKuztaj2IqnuGg5Sdray4OT5vEQqje0D5xFSKlZ3g6nJdXMbIVTw_0spXCYKJtZg_m1tzk_4KMAadQ5NF0PlB6jnSUrAm9KcJBL5-vsBEwPnUZK3eMUqffPln8woR8Q109EkPjNFf5aGjpIy4_EfSkVgXdeO1wG0K5GSX5QZjBhh6ZK-dndq4M=s2048?key=jdiiL1EtvjDcCkO-Uf60HA'
        run: |
          python - <<'PY'
          import os, pathlib, urllib.request, struct
          url = os.environ['ART_URL']
          data = urllib.request.urlopen(url, timeout=60).read()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Expected PNG artwork; refused unexpected response')
          width, height = struct.unpack('>II', data[16:24])
          if width < 1500 or height < 800:
              raise SystemExit('Refused a low-resolution thumbnail')
          path = pathlib.Path('public/week-7-editors-note.png')
          path.parent.mkdir(exist_ok=True)
          path.write_bytes(data)
          print('Approved artwork:', width, height, len(data), 'bytes')
          PY
      - name: Commit only the approved artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/week-7-editors-note.png
          git diff --cached --quiet && exit 0
          git commit -m 'Add full-resolution approved Week 7 editorial illustration'
          git pull --rebase origin main
          git push origin HEAD:main
